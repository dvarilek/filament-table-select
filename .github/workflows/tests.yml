name: tests

on: ['push', 'pull_request']

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4]
        filament: [3, 5]
        stability: [prefer-stable]
        exclude:
          - php: 8.2
            filament: 5

    name: tests P${{ matrix.php }} - Filament ${{ matrix.filament }} - ${{ matrix.stability }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite, pdo_sqlite, pdo

      - name: install dependencies (Filament 3)
        if: matrix.filament == 3
        run: |
          composer require filament/filament:^3.0 --no-interaction --no-update
          composer update --${{ matrix.stability }} --no-interaction --prefer-dist --optimize-autoloader

      - name: install dependencies (Filament 5)
        if: matrix.filament == 5
        run: |
          composer require filament/filament:^5.0 --no-interaction --no-update
          composer update --${{ matrix.stability }} --no-interaction --prefer-dist --optimize-autoloader

      - name: execute tests
        run: vendor/bin/pest --ci
